<header class="page-header"><h1>Entregas</h1></header>

<section class="panel">
  <h2>Registrar entrega</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <label>
      Pedido
      <select formControlName="orderId">
        <option value="">Selecione…</option>
        @for (o of orders(); track o.id) {
          <option [value]="o.id">{{ o.orderNumber }} ({{ statusLabel[o.status] }})</option>
        }
      </select>
    </label>
    @if (orders().length === 0) {
      <p class="empty">Nenhum pedido com status "Enviado" disponível para entrega.</p>
    }
    <label>Data/hora<input type="datetime-local" formControlName="deliveredAt" /></label>
    <label class="full">Observações<textarea rows="3" formControlName="notes"></textarea></label>
    <button type="submit" [disabled]="form.invalid || creating()">
      {{ creating() ? 'Registrando…' : 'Registrar' }}
    </button>
  </form>

  @if (error())   { <p class="error">{{ error() }}</p> }
  @if (success()) { <p class="success">{{ success() }}</p> }
</section>
